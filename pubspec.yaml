name: georide
description: "Pokemon GO inspired real-time GPS ride-sharing app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  maplibre_gl: 0.25.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_database: 12.2.0
  http: ^1.3.0
  rxdart: ^0.28.0
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Light.ttf
          weight: 300
        - asset: assets/fonts/ChakraPetch-Regular.ttf
          weight: 400
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
    - family: RussoOne
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
          weight: 400
  assets:
    - assets/style.json
    - assets/fonts/ChakraPetch-Light.ttf
    - assets/fonts/ChakraPetch-Regular.ttf
    - assets/fonts/ChakraPetch-Medium.ttf
    - assets/fonts/ChakraPetch-SemiBold.ttf
    - assets/fonts/ChakraPetch-Bold.ttf
    - assets/fonts/RussoOne-Regular.ttf
